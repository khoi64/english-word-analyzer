<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>English Word Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <p class="small-title">LEARN ENGLISH</p>

            <h1>English Word Analyzer</h1>

            <p class="subtitle">
                Phân tích từ loại và nghĩa của từ tiếng Anh
            </p>
        </header>


        <div class="search-box">

            <input
                id="wordInput"
                type="text"
                placeholder="Nhập từ tiếng Anh..."
            >

            <button onclick="analyzeWord()">
                Phân tích
            </button>

        </div>


        <p id="status"></p>


        <div id="result"></div>

    </div>


    <script src="script.js"></script>

</body>
</html>
