<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>English Word Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="container">

        <header>

            <p class="small-title">
                LEARN ENGLISH
            </p>

            <h1>
                English Word Analyzer
            </h1>

            <p class="subtitle">
                Tra từ và học từ vựng bằng Quiz
            </p>

        </header>


        <!-- SEARCH -->

        <section class="search-section">

            <div class="search-box">

                <input
                    id="wordInput"
                    type="text"
                    placeholder="Nhập từ tiếng Anh..."
                >

                <button onclick="analyzeWord()">
                    🔎 Phân tích
                </button>

            </div>

        </section>


        <p id="status"></p>


        <!-- RESULT -->

        <div id="result"></div>


        <!-- HISTORY -->

        <section class="history-section">

            <div class="section-title">

                <h2>
                    🕘 Từ đã tra
                </h2>

                <button
                    class="quiz-button"
                    onclick="startQuiz()"
                >
                    🎮 Quiz
                </button>

            </div>


            <div id="history"></div>

        </section>


        <!-- QUIZ -->

        <section
            id="quizSection"
            class="quiz-section hidden"
        >

            <div class="quiz-header">

                <h2>
                    🎮 English Quiz
                </h2>

                <p id="quizProgress"></p>

            </div>


            <div id="quizContent"></div>


            <button
                id="nextButton"
                class="next-button hidden"
                onclick="nextQuestion()"
            >
                Câu tiếp theo →
            </button>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
